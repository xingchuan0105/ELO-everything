<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon / tab icon — simplified balance for 16–32px -->
  <rect width="32" height="32" rx="8" fill="#171717"/>
  <!-- Beam -->
  <rect x="6" y="13.5" width="20" height="2" rx="1" fill="#F5F5F5" transform="rotate(-8 16 14.5)"/>
  <!-- Left block (higher) -->
  <rect x="7" y="7" width="6" height="8" rx="1.5" fill="#F5F5F5" transform="rotate(-8 10 11)"/>
  <!-- Right block (lower) -->
  <rect x="19" y="9" width="6" height="8" rx="1.5" fill="#F5F5F5" opacity="0.9" transform="rotate(-8 22 13)"/>
  <!-- Copper fulcrum -->
  <path d="M16 16.5 L19.5 23.5 H12.5 Z" fill="#B87333"/>
  <rect x="11" y="24.5" width="10" height="1.5" rx="0.75" fill="#3A3A3A"/>
</svg>
