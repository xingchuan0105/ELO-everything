<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ELO-everything">
  <title>ELO-everything</title>
  <!-- Rounded app tile — monochrome ink -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#171717"/>
  <!-- Soft inner edge -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Balance beam (slight tilt: left high / right low) -->
  <g transform="translate(32 30) rotate(-8)">
    <!-- Beam -->
    <rect x="-20" y="-1.25" width="40" height="2.5" rx="1.25" fill="#F5F5F5"/>
    <!-- Left pan (higher side of tilt) — opponent A -->
    <rect x="-19" y="-14" width="10" height="14" rx="3" fill="#F5F5F5"/>
    <!-- Right pan (lower) — opponent B -->
    <rect x="9" y="-10" width="10" height="14" rx="3" fill="#F5F5F5" opacity="0.88"/>
  </g>

  <!-- Fulcrum — copper brand accent -->
  <path d="M32 34 L38 46 H26 Z" fill="#B87333"/>
  <!-- Fulcrum tip highlight -->
  <circle cx="32" cy="34" r="2.2" fill="#C98545"/>

  <!-- Base plinth -->
  <rect x="22" y="48" width="20" height="3" rx="1.5" fill="#3A3A3A"/>
</svg>
