services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elo
      POSTGRES_PASSWORD: elo
      POSTGRES_DB: elo_everything
    ports:
      - "54329:5432"
    volumes:
      - elo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elo -d elo_everything"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elo_pg:
